<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wordglass tekrar</title>
    <link rel="stylesheet" href="theme.css" />
    <style>
      body { min-height: 100vh; display: grid; place-items: center; }
      .shell { width: min(520px, calc(100vw - 40px)); padding: 28px 0 40px; }
      .topbar { display: flex; align-items: center; margin-bottom: 16px; }
      .backlink { color: #9fd9b8; text-decoration: none; font-size: 11px; padding: 3px 8px; border-radius: 8px; }
      .backlink:hover { background: rgba(47, 191, 113, 0.1); }
      .level { margin-left: auto; font-size: 10px; letter-spacing: .4px; color: #86a294; }
      .bar { height: 3px; background: rgba(47, 191, 113, 0.12); border-radius: 3px; overflow: hidden; margin-bottom: 22px; }
      .bar i { display: block; height: 100%; width: 0; background: #2fbf71; transition: width .25s ease; }
      .meta { display: flex; font-size: 10.5px; color: var(--dim); margin-bottom: 8px; letter-spacing: .3px; }
      .meta span:last-child { margin-left: auto; }
      .card {
        background: rgba(9, 18, 13, 0.7);
        border: 1px solid rgba(47, 191, 113, 0.2);
        border-radius: 14px;
        padding: 22px 20px;
        min-height: 210px;
        animation: rise .28s cubic-bezier(.2,.8,.25,1) both;
      }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      .word { font-size: 30px; font-weight: 700; color: #f2fff7; letter-spacing: -.2px; }
      .word:focus { outline: none; }
      .rev { margin-top: 16px; border-top: 1px solid rgba(47, 191, 113, 0.12); padding-top: 14px; }
      .rev .pos {
        display: inline-block; font-size: 9px; font-weight: 600; letter-spacing: .3px;
        color: #9fd9b8; background: rgba(47, 191, 113, 0.1);
        border: 1px solid rgba(47, 191, 113, 0.2); border-radius: 99px;
        padding: 0 7px; margin-top: 8px;
      }
      .tr { font-size: 18px; color: #c9ffdd; }
      .show { margin-top: 18px; }
      .grades { display: flex; gap: 8px; margin-top: 16px; }
      .grades button { flex: 1 1 0; padding: 9px 6px; font-size: 12px; }
      .grades .no { color: #e0a08c; border-color: rgba(224, 160, 140, 0.3); background: rgba(224, 160, 140, 0.08); }
      .grades .mid { color: #d8cf9a; border-color: rgba(216, 207, 154, 0.28); background: rgba(216, 207, 154, 0.07); }
      .done { text-align: center; padding: 40px 0; }
      .done h2 { font-size: 17px; font-weight: 600; color: #eafff2; margin: 0 0 6px; }
      .done p { color: var(--dim); font-size: 12px; margin: 0 0 18px; }
      .keys { font-size: 10px; color: #86a294; margin-top: 14px; text-align: center; }
      .empty { color: var(--dim); font-size: 13px; text-align: center; padding: 50px 0; }
      .acts { display: flex; gap: 6px; margin-top: 12px; justify-content: center; }
      .acts button { background: none; border: 0; color: #86a294; font-size: 10.5px; padding: 4px 8px; border-radius: 7px; min-height: 26px; }
      .acts button:hover { color: #d9ffe9; background: rgba(47, 191, 113, 0.1); }
      .levelbadge { font-size: 9.5px; color: #9fd9b8; background: rgba(47, 191, 113, 0.1); border: 1px solid rgba(47, 191, 113, 0.18); border-radius: 99px; padding: 1px 7px; }
      .grades button:focus-visible { outline: 2px solid rgba(47, 191, 113, 0.6); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="topbar">
        <a class="backlink" href="app.html">‹ deftere dön</a>
        <span class="level" id="level"></span>
      </div>
      <div class="bar"><i id="prog"></i></div>
      <div class="meta"><span id="pos">0/0</span><span id="left"></span></div>
      <div id="stage"></div>
      <div class="keys">boşluk: göster · 1 bilmedim · 2 zor · 3 bildim</div>
    </div>
    <script src="review.js"></script>
  </body>
</html>
